app:
  description: >-
    Programmatic four-tier LLM gateway for G-CaMVo. After import, map each of the
    four LLM nodes to a distinct company model, publish the Workflow, and call its
    Service API. Do not use scientific results while all nodes still use the
    portable OpenAI placeholder model.
  icon: 🛡️
  icon_background: '#E8F5E9'
  mode: workflow
  name: G-CaMVo Multi-Model Gateway
  use_icon_as_answer_icon: false
kind: app
version: 0.1.5
workflow:
  conversation_variables: []
  environment_variables: []
  features: {}
  graph:
    edges:
    - data:
        isInIteration: false
        sourceType: start
        targetType: if-else
      id: start-source-route-cheap-a-target
      source: start
      sourceHandle: source
      target: route-cheap-a
      targetHandle: target
      type: custom
    - data:
        isInIteration: false
        sourceType: if-else
        targetType: llm
      id: route-cheap-a-true-llm-cheap-a-target
      source: route-cheap-a
      sourceHandle: 'true'
      target: llm-cheap-a
      targetHandle: target
      type: custom
    - data:
        isInIteration: false
        sourceType: if-else
        targetType: if-else
      id: route-cheap-a-false-route-cheap-b-target
      source: route-cheap-a
      sourceHandle: 'false'
      target: route-cheap-b
      targetHandle: target
      type: custom
    - data:
        isInIteration: false
        sourceType: if-else
        targetType: llm
      id: route-cheap-b-true-llm-cheap-b-target
      source: route-cheap-b
      sourceHandle: 'true'
      target: llm-cheap-b
      targetHandle: target
      type: custom
    - data:
        isInIteration: false
        sourceType: if-else
        targetType: if-else
      id: route-cheap-b-false-route-balanced-target
      source: route-cheap-b
      sourceHandle: 'false'
      target: route-balanced
      targetHandle: target
      type: custom
    - data:
        isInIteration: false
        sourceType: if-else
        targetType: llm
      id: route-balanced-true-llm-balanced-target
      source: route-balanced
      sourceHandle: 'true'
      target: llm-balanced
      targetHandle: target
      type: custom
    - data:
        isInIteration: false
        sourceType: if-else
        targetType: llm
      id: route-balanced-false-llm-strong-target
      source: route-balanced
      sourceHandle: 'false'
      target: llm-strong
      targetHandle: target
      type: custom
    - data:
        isInIteration: false
        sourceType: llm
        targetType: end
      id: llm-cheap-a-source-end-cheap-a-target
      source: llm-cheap-a
      sourceHandle: source
      target: end-cheap-a
      targetHandle: target
      type: custom
    - data:
        isInIteration: false
        sourceType: llm
        targetType: end
      id: llm-cheap-b-source-end-cheap-b-target
      source: llm-cheap-b
      sourceHandle: source
      target: end-cheap-b
      targetHandle: target
      type: custom
    - data:
        isInIteration: false
        sourceType: llm
        targetType: end
      id: llm-balanced-source-end-balanced-target
      source: llm-balanced
      sourceHandle: source
      target: end-balanced
      targetHandle: target
      type: custom
    - data:
        isInIteration: false
        sourceType: llm
        targetType: end
      id: llm-strong-source-end-strong-target
      source: llm-strong
      sourceHandle: source
      target: end-strong
      targetHandle: target
      type: custom
    nodes:
    - data:
        desc: >-
          Called by the G-CaMVo Python adapter. Prompts are generated by the
          versioned security task contract in the repository.
        selected: false
        title: Start
        type: start
        variables:
        - hint: Stable routing alias selected by CaMVo/G-CaMVo
          label: Model tier
          options:
          - cheap_a
          - cheap_b
          - balanced
          - strong
          required: true
          type: select
          variable: model_tier
        - default: ''
          hint: Trusted task instructions generated by the local experiment code
          label: System prompt
          max_length: null
          options: []
          required: true
          type: paragraph
          variable: system_prompt
        - default: ''
          hint: Security evidence and strict JSON response contract
          label: User prompt
          max_length: null
          options: []
          required: true
          type: paragraph
          variable: user_prompt
      height: 168
      id: start
      position:
        x: 40
        y: 380
      positionAbsolute:
        x: 40
        y: 380
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        cases:
        - case_id: 'true'
          conditions:
          - comparison_operator: is
            id: 5b8d7f2a-86d3-4e29-92c1-4a9fd35f0101
            value: cheap_a
            varType: string
            variable_selector:
            - start
            - model_tier
          logical_operator: and
        desc: Route cheap_a; otherwise continue validation
        selected: false
        title: Is cheap_a?
        type: if-else
      height: 126
      id: route-cheap-a
      position:
        x: 350
        y: 380
      positionAbsolute:
        x: 350
        y: 380
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        cases:
        - case_id: 'true'
          conditions:
          - comparison_operator: is
            id: 5b8d7f2a-86d3-4e29-92c1-4a9fd35f0102
            value: cheap_b
            varType: string
            variable_selector:
            - start
            - model_tier
          logical_operator: and
        desc: Route cheap_b; otherwise continue validation
        selected: false
        title: Is cheap_b?
        type: if-else
      height: 126
      id: route-cheap-b
      position:
        x: 660
        y: 480
      positionAbsolute:
        x: 660
        y: 480
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        cases:
        - case_id: 'true'
          conditions:
          - comparison_operator: is
            id: 5b8d7f2a-86d3-4e29-92c1-4a9fd35f0103
            value: balanced
            varType: string
            variable_selector:
            - start
            - model_tier
          logical_operator: and
        desc: Route balanced; validated select fallback is strong
        selected: false
        title: Is balanced?
        type: if-else
      height: 126
      id: route-balanced
      position:
        x: 970
        y: 580
      positionAbsolute:
        x: 970
        y: 580
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: >-
          PORTABLE PLACEHOLDER. After import, bind to the fastest/cheapest
          company model; suggested role: DeepSeek V4 Flash or equivalent.
        model:
          completion_params:
            max_tokens: 128
            temperature: 0
          mode: chat
          name: gpt-3.5-turbo
          provider: openai
        prompt_template:
        - id: prompt-cheap-a-system
          role: system
          text: '{{#start.system_prompt#}}'
        - id: prompt-cheap-a-user
          role: user
          text: '{{#start.user_prompt#}}'
        retry_config:
          max_retries: 0
          retry_enabled: false
          retry_interval: 0
        selected: false
        title: '[MAP MODEL] CHEAP_A'
        type: llm
        vision:
          enabled: false
      height: 98
      id: llm-cheap-a
      position:
        x: 660
        y: 150
      positionAbsolute:
        x: 660
        y: 150
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: >-
          PORTABLE PLACEHOLDER. After import, bind to a second inexpensive model
          from another family; suggested role: Gemini Flash or equivalent.
        model:
          completion_params:
            max_tokens: 128
            temperature: 0
          mode: chat
          name: gpt-3.5-turbo
          provider: openai
        prompt_template:
        - id: prompt-cheap-b-system
          role: system
          text: '{{#start.system_prompt#}}'
        - id: prompt-cheap-b-user
          role: user
          text: '{{#start.user_prompt#}}'
        retry_config:
          max_retries: 0
          retry_enabled: false
          retry_interval: 0
        selected: false
        title: '[MAP MODEL] CHEAP_B'
        type: llm
        vision:
          enabled: false
      height: 98
      id: llm-cheap-b
      position:
        x: 970
        y: 350
      positionAbsolute:
        x: 970
        y: 350
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: >-
          PORTABLE PLACEHOLDER. After import, bind to the mid-tier model;
          suggested role: Claude Sonnet or an equivalent balanced model.
        model:
          completion_params:
            max_tokens: 128
            temperature: 0
          mode: chat
          name: gpt-3.5-turbo
          provider: openai
        prompt_template:
        - id: prompt-balanced-system
          role: system
          text: '{{#start.system_prompt#}}'
        - id: prompt-balanced-user
          role: user
          text: '{{#start.user_prompt#}}'
        retry_config:
          max_retries: 0
          retry_enabled: false
          retry_interval: 0
        selected: false
        title: '[MAP MODEL] BALANCED'
        type: llm
        vision:
          enabled: false
      height: 98
      id: llm-balanced
      position:
        x: 1280
        y: 550
      positionAbsolute:
        x: 1280
        y: 550
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: >-
          PORTABLE PLACEHOLDER. After import, bind to the most reliable available
          model; suggested role: GPT high tier, Claude Opus, or equivalent.
        model:
          completion_params:
            max_tokens: 128
            temperature: 0
          mode: chat
          name: gpt-3.5-turbo
          provider: openai
        prompt_template:
        - id: prompt-strong-system
          role: system
          text: '{{#start.system_prompt#}}'
        - id: prompt-strong-user
          role: user
          text: '{{#start.user_prompt#}}'
        retry_config:
          max_retries: 0
          retry_enabled: false
          retry_interval: 0
        selected: false
        title: '[MAP MODEL] STRONG'
        type: llm
        vision:
          enabled: false
      height: 98
      id: llm-strong
      position:
        x: 1280
        y: 750
      positionAbsolute:
        x: 1280
        y: 750
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: Unified output contract
        outputs:
        - value_selector:
          - llm-cheap-a
          - text
          variable: result
        - value_selector:
          - start
          - model_tier
          variable: model_tier
        selected: false
        title: End CHEAP_A
        type: end
      height: 116
      id: end-cheap-a
      position:
        x: 970
        y: 100
      positionAbsolute:
        x: 970
        y: 100
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: Unified output contract
        outputs:
        - value_selector:
          - llm-cheap-b
          - text
          variable: result
        - value_selector:
          - start
          - model_tier
          variable: model_tier
        selected: false
        title: End CHEAP_B
        type: end
      height: 116
      id: end-cheap-b
      position:
        x: 1280
        y: 300
      positionAbsolute:
        x: 1280
        y: 300
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: Unified output contract
        outputs:
        - value_selector:
          - llm-balanced
          - text
          variable: result
        - value_selector:
          - start
          - model_tier
          variable: model_tier
        selected: false
        title: End BALANCED
        type: end
      height: 116
      id: end-balanced
      position:
        x: 1590
        y: 500
      positionAbsolute:
        x: 1590
        y: 500
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: Unified output contract
        outputs:
        - value_selector:
          - llm-strong
          - text
          variable: result
        - value_selector:
          - start
          - model_tier
          variable: model_tier
        selected: false
        title: End STRONG
        type: end
      height: 116
      id: end-strong
      position:
        x: 1590
        y: 700
      positionAbsolute:
        x: 1590
        y: 700
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    viewport:
      x: 0
      y: 0
      zoom: 0.65
