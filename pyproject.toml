[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "camvo"
version = "0.9.0"
description = "Provider-agnostic CaMVo and graph-regularized G-CaMVo security routing experiments."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "G-CaMVo contributors" }]
dependencies = [
  "numpy>=1.26,<3.0",
  "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-cov>=5.0,<7.0",
  "ruff>=0.9,<1.0",
]
sentence-transformers = ["sentence-transformers>=3.0,<6.0"]

[project.scripts]
camvo-simulate = "camvo.cli:main"
camvo-casie-poc = "camvo.security.cli:main"
camvo-optc-audit = "camvo.security.optc_cli:main"
camvo-mordor-audit = "camvo.security.mordor_cli:main"
camvo-optc-preflight = "camvo.security.optc_preflight_cli:main"
camvo-optc-label-audit = "camvo.security.optc_label_cli:main"
camvo-optc-graph-smoke = "camvo.security.optc_graph_smoke:main"
camvo-security-experiment = "camvo.security.experiment_cli:main"
camvo-security-real = "camvo.security.real_experiment_cli:main"
camvo-security-formal = "camvo.security.formal_experiment_cli:main"
camvo-trace-experiment = "camvo.security.trace_experiment_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
